name: cmake build release

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install Git
      run: |
        sudo apt update
        sudo apt install -y git
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Install Packages
      run: |
        sudo apt update
        sudo apt install -y build-essential cmake ninja-build libfreetype6-dev libglu1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libudev-dev wget software-properties-common

    - name: Install Clang
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 20

    - name: Build
      run: |
        VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,' | sed -e 's/^v//')
        cmake --preset release -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 -DCPACK_PACKAGE_VERSION=$VERSION
        cmake --build build

    - name: Upload Source
      uses: actions/upload-artifact@v4
      with:
        name: Source
        path: .

  package:
    needs: build
    runs-on: ubuntu-22.04

    steps:
    - name: Download Source
      uses: actions/download-artifact@v4
      with:
        name: Source

    - name: Install AppImage Tools
      run: |
        wget https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
        chmod +x linuxdeploy-x86_64.AppImage

    - name: Generate Package (Deb)
      run: |
        cd build
        cpack -G DEB

    - name: Generate Package (AppImage)
      run: |
        cmake --install build --prefix _appdir/usr
        ./linuxdeploy-x86_64.AppImage --appdir _appdir/ --output appimage

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Release-Artifacts
        path: |
          ./XSetWacomGUI-*.AppImage
          ./_packages/xsetwacomgui_*.deb

  release:
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        name: Release-Artifacts

    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./*.AppImage
          ./_packages/*.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
