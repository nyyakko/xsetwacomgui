name: cmake build release

on:
  push:
    tags:
      - "*"

jobs:
  build_release:
    runs-on: ubuntu-latest
    container: 
      image: debian:12-slim

    permissions:
      contents: write
    
    steps:
    - name: Install Git and Checkout
      run: |
        apt update
        apt install -y git
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        apt update
        apt install -y \
          build-essential \
          cmake \
          ninja-build \
          libfreetype6-dev \
          libglu1-mesa-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libudev-dev \
          wget \
          software-properties-common

    - name: Install Compiler
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        ./llvm.sh 20
    
    - name: Build
      run: |
        VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
        [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')
        cmake --preset release -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 -DCPACK_PACKAGE_VERSION=$VERSION
        cmake --build build

    - name: Package
      run: cd build && cpack -G DEB
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        path: _packages/xsetwacomgui_*_amd64.deb

    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: _packages/xsetwacomgui_*_amd64.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
