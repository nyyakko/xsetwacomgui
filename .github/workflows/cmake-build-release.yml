name: cmake build release

on:
  push:
    tags:
      - "*"

jobs:
  build_release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
         sudo apt update
         sudo apt install clang-20 libfreetype6-dev libglu1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libudev-dev

    - name: Build
      run: |
        cmake --preset release -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 -DCPACK_PACKAGE_VERSION=${{ github.event.release.tag_name }}
        cmake --build build

    - name: Package
      run: cd build && cpack -G DEB
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        path: _packages/xsetwacomgui_*_amd64.deb

    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: _packages/xsetwacomgui_*_amd64.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
